name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 테스트는 CI 에서 돌리지 않는다. 테스트 전용 설정(src/test/resources)이
      # 저장소에 없어 러너에서는 실제 DB 접속 정보를 찾지 못한다.
      - name: 빌드 (테스트 제외)
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mukkeu:latest

      - name: 인스턴스에 .env 생성 & 배포
        uses: appleboy/ssh-action@v1
        env:
          # ── DB (Oracle Autonomous Database, TLS 접속) ──
          ORACLE_DB_URL: ${{ secrets.ORACLE_DB_URL }}
          ORACLE_DB_USERNAME: ${{ secrets.ORACLE_DB_USERNAME }}
          ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
          DB_POOL_SIZE: ${{ secrets.DB_POOL_SIZE }}
          JPA_DDL_AUTO: ${{ secrets.JPA_DDL_AUTO }}
          JPA_SHOW_SQL: ${{ secrets.JPA_SHOW_SQL }}
          # ── JWT ──
          JWT_APP_KEY: ${{ secrets.JWT_APP_KEY }}
          JWT_ACCESS_EXP: ${{ secrets.JWT_ACCESS_EXP }}
          JWT_REFRESH_EXP: ${{ secrets.JWT_REFRESH_EXP }}
          # ── 외부 API ──
          KAKAO_NAVI_KEY: ${{ secrets.KAKAO_NAVI_KEY }}
          KAKAO_NAVI_URL: ${{ secrets.KAKAO_NAVI_URL }}
          # ── 앱 ──
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ORACLE_DB_URL,ORACLE_DB_USERNAME,ORACLE_DB_PASSWORD,DB_POOL_SIZE,JPA_DDL_AUTO,JPA_SHOW_SQL,JWT_APP_KEY,JWT_ACCESS_EXP,JWT_REFRESH_EXP,KAKAO_NAVI_KEY,KAKAO_NAVI_URL,CORS_ALLOWED_ORIGINS
          script: |
            set -e
            APP_DIR=$HOME/mukkeu
            mkdir -p $APP_DIR

            # ── .env ──────────────────────────────────────────────
            # 값에 따옴표를 붙이지 않는다. docker --env-file 은 따옴표까지 값으로 읽는다.
            cat > $APP_DIR/.env << EOF
            ORACLE_DB_URL=${ORACLE_DB_URL}
            ORACLE_DB_USERNAME=${ORACLE_DB_USERNAME}
            ORACLE_DB_PASSWORD=${ORACLE_DB_PASSWORD}
            DB_POOL_SIZE=${DB_POOL_SIZE:-10}
            JPA_DDL_AUTO=${JPA_DDL_AUTO:-none}
            JPA_SHOW_SQL=${JPA_SHOW_SQL:-false}
            JWT_APP_KEY=${JWT_APP_KEY}
            JWT_ACCESS_EXP=${JWT_ACCESS_EXP:-3600000}
            JWT_REFRESH_EXP=${JWT_REFRESH_EXP:-1209600000}
            KAKAO_NAVI_KEY=${KAKAO_NAVI_KEY}
            KAKAO_NAVI_URL=${KAKAO_NAVI_URL}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            SERVER_PORT=8700
            EOF
            chmod 600 $APP_DIR/.env

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mukkeu:latest
            docker stop mukkeu || true
            docker rm   mukkeu || true
            docker run -d \
              --name mukkeu \
              --restart unless-stopped \
              --env-file $APP_DIR/.env \
              -p 8700:8700 \
              ${{ secrets.DOCKERHUB_USERNAME }}/mukkeu:latest
            docker image prune -f
